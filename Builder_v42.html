<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style_min.css">
</head>
<body>
<div class="app">

  <!-- ══ HEADER ════════════════════════════════ -->
  <header class="header">
    <a href="#" class="logo">
      <div class="logo-icon">B</div>
      Builder
    </a>
    <div class="h-gap"></div>
    <button class="hbtn ghost" id="btn-clear">Очистити</button>
    <button class="hbtn" id="btn-code">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3L1 8l4 5M11 3l4 5-4 5"/></svg>
      Код
    </button>
    <button class="hbtn" id="btn-translate" title="Перекласти на російську через AI">
      🇷🇺 Перекласти
    </button>
    <button class="hbtn primary" id="btn-copy">Скопіювати HTML</button>
  </header>

  <!-- ══ WORKSPACE ══════════════════════════════ -->
  <div class="workspace">

    <!-- ─── SETTINGS PANEL (LEFT) ───────────── -->
    <aside class="settings-panel" id="settings-panel">
      <div class="sp-header">
        <span class="sp-header-icon" id="sp-icon">◻</span>
        <span class="sp-header-title" id="sp-title">Налаштування</span>
        <button class="sp-close-btn" id="sp-close" title="Закрити">✕</button>
      </div>
      <div class="device-tabs" id="device-tabs">
        <button class="device-tab" data-device="mobile">📱 Мобільна</button>
        <button class="device-tab is-active" data-device="desktop">🖥 Десктоп</button>
      </div>
      <div class="sp-body show-desktop" id="sp-body">
        <div class="sp-empty">
          <div class="sp-empty-icon">✦</div>
          <div class="sp-empty-title">Виберіть блок</div>
          <div class="sp-empty-desc">Натисніть блок або ⚙ контейнера, щоб відкрити налаштування</div>
        </div>
      </div>
    </aside>

    <!-- ─── CANVAS ──────────────────────────── -->
    <div class="canvas-area" id="canvas-area">
      <div class="canvas" id="canvas">

        <div class="empty-state" id="empty-state" tabindex="0" role="button" aria-label="Додати перший контейнер">
          <div class="empty-state-icon">⊞</div>
          <div class="empty-state-title">Почніть зі структури</div>
          <div class="empty-state-sub">Натисніть щоб вибрати розмітку<br>і додати перший контейнер</div>
        </div>

        <div class="add-row-zone" id="add-row-zone">
          <button class="add-row-btn" id="add-row-main">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="5.5" y1="1" x2="5.5" y2="10"/><line x1="1" y1="5.5" x2="10" y2="5.5"/></svg>
            Додати контейнер
          </button>
        </div>
      </div>
    </div>

    <!-- ─── PREVIEW PANEL (RIGHT) ───────────── -->
    <div class="preview-panel" id="preview-panel">
      <div class="pp-header">
        <span class="pp-title">Перегляд верстки</span>
        <div class="pp-tabs">
          <button class="pp-tab is-active" data-device="desktop" id="pp-tab-desktop">🖥 Десктоп</button>
          <button class="pp-tab" data-device="mobile" id="pp-tab-mobile">📱 Мобільна</button>
        </div>
      </div>
      <div class="pp-viewport-wrap" id="pp-viewport-wrap">
        <div class="pp-scale-wrap" id="pp-scale-wrap">
          <iframe class="pp-frame" id="pp-frame" title="Перегляд"></iframe>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ══ LAYOUT MODAL ════════════════════════════ -->
<div class="overlay" id="layout-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Виберіть розмітку контейнера</span>
      <button class="modal-close" id="layout-modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="layout-grid" id="layout-grid"></div>
    </div>
  </div>
</div>

<!-- ══ BLOCK MODAL ═════════════════════════════ -->
<div class="overlay" id="block-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Додати блок</span>
      <button class="modal-close" id="block-modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="block-section-title">Основні блоки</div>
      <div class="block-pick-grid" id="block-pick-grid"></div>
    </div>
  </div>
</div>

<!-- ══ CODE DRAWER ════════════════════════════ -->
<div class="code-drawer" id="code-drawer">
  <div class="drawer-header">
    <div class="drawer-tabs">
      <button class="dtab is-active" data-tab="code">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3L1 8l4 5M11 3l4 5-4 5"/></svg>
        HTML-код
      </button>
    </div>
    <div class="drawer-actions">
      <button class="dbtn" id="btn-refresh">↺ Оновити</button>
      <button class="dbtn primary" id="btn-copy-drawer">Копіювати</button>
      <button class="dbtn" id="btn-drawer-close">✕</button>
    </div>
  </div>
  <div class="drawer-pane is-active" id="pane-code">
    <textarea class="code-output" id="code-out" readonly placeholder="HTML з'явиться тут автоматично…"></textarea>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ══ TRANSLATE MODAL ════════════════════════ -->
<div class="overlay" id="translate-overlay">
  <div class="modal" style="width:560px;max-width:96vw;">
    <div class="modal-header">
      <span class="modal-title">🇷🇺 Переклад на російську</span>
      <button class="modal-close" id="translate-modal-close">✕</button>
    </div>
    <div class="modal-body" style="padding:16px 18px;">
      <div id="translate-status" style="display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:13px;color:var(--t3);">
        <span id="translate-status-text">Готовий до перекладу</span>
      </div>
      <div style="display:flex;gap:10px;margin-bottom:14px;">
        <button class="hbtn primary" id="btn-do-translate" style="flex:1;">
          🌐 Перекласти
        </button>
        <button class="hbtn" id="btn-copy-ru" style="flex:1;" disabled>
          📋 Скопіювати RU HTML
        </button>
      </div>
      <div style="position:relative;">
        <textarea id="ru-html-out" readonly
          style="width:100%;height:260px;background:#0D1117;border:1px solid #30363D;border-radius:6px;
                 padding:12px;font-family:monospace;font-size:11px;color:#58A6FF;resize:none;outline:none;
                 line-height:1.6;"
          placeholder="Тут з'явиться HTML з перекладеним текстом…"></textarea>
      </div>
    </div>
  </div>
</div>

<!--
  ═══════════════════════════════════════════════
  ПІДКЛЮЧЕННЯ СКРИПТІВ
  ───────────────────────────────────────────────
  script.js            — базовий стан, LAYOUTS/BLOCK_META, row/block система
  core.js               — спільний рушій: blockToHTML(), buildFields(),
                           buildPadBar(), textLinesToHTML(), і т.д.
  textElement.js         — блок "Текст" (поля + рендер HTML)
  imageElement.js        — блок "Зображення" (поля + рендер HTML)
  videoElement.js        — блок "Відео" (поля + рендер HTML)
  switcherElement.js     — блок "Перемикач" (поля + рендер HTML)
  swimageElement.js      — блок "Зображення (перемикача)" (поля + рендер HTML)
  dragElements.js         — drag & drop рядків/блоків
  generateHTML.js         — збірка фінального HTML з рядків/колонок
  clearButton.js          — кнопка "Очистити"
  copyCode.js             — кнопка "Скопіювати HTML"
  translation.js          — переклад тексту на російську через AI
  ═══════════════════════════════════════════════
-->
<script src="script.js"></script>
<script src="core.js"></script>
<script src="textElement.js"></script>
<script src="imageElement.js"></script>
<script src="videoElement.js"></script>
<script src="switcherElement.js"></script>
<script src="swimageElement.js"></script>
<script src="dragElements.js"></script>
<script src="generateHTML.js"></script>
<script src="clearButton.js"></script>
<script src="copyCode.js"></script>
<script src="translation.js"></script>
</body>
</html>
