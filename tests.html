<script>
/* ═══════════════════════════════════════════════
   Тестовий раннер — простий, без залежностей.
   Кожен тест: живий виклик реальних функцій застосунку
   (generateHTML, blockToHTML, esc, safeUrl, ...) на реальному
   DOM цієї сторінки — не mock, справжня інтеграція.
═══════════════════════════════════════════════ */
(function () {
  const cases = [];
  function test(name, fn) {
    try {
      fn();
      cases.push({ name, pass: true });
    } catch (err) {
      cases.push({ name, pass: false, detail: err.message });
    }
  }
  function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
  function assertIncludes(haystack, needle, msg) {
    assert(haystack.includes(needle), (msg || 'expected string to include substring') + `\n  очікували підрядок: ${JSON.stringify(needle)}\n  отримали: ${JSON.stringify(haystack.slice(0, 300))}`);
  }
  function assertNotIncludes(haystack, needle, msg) {
    assert(!haystack.includes(needle), (msg || 'expected string NOT to include substring') + `\n  небажаний підрядок: ${JSON.stringify(needle)}\n  отримали: ${JSON.stringify(haystack.slice(0, 300))}`);
  }
  function clearCanvas() { if (typeof clearAll === 'function') clearAll(); }

  /* ─── esc() ──────────────────────────────────── */
  test('esc() екранує & < > " \'', () => {
    assert(esc(`&<>"'`) === '&amp;&lt;&gt;&quot;&#39;', 'esc() output: ' + esc(`&<>"'`));
  });

  /* ─── safeUrl() ──────────────────────────────── */
  test('safeUrl() пропускає http(s), відкидає javascript:', () => {
    assert(safeUrl('https://example.com/a.jpg') === 'https://example.com/a.jpg');
    assert(safeUrl('javascript:alert(1)') === '');
    assert(safeUrl('  http://x.com  ') === 'http://x.com');
  });
  test('safeUrl() з allowDataImage пропускає лише data:image/*', () => {
    assert(safeUrl('data:image/png;base64,AAAA', { allowDataImage: true }) === 'data:image/png;base64,AAAA');
    assert(safeUrl('data:text/html;base64,AAAA', { allowDataImage: true }) === '');
    assert(safeUrl('data:image/png;base64,AAAA') === ''); // без allowDataImage — відхиляємо
  });

  /* ─── generateHTML(): порожній canvas ────────── */
  test('generateHTML() повертає "" на порожньому canvas', () => {
    clearCanvas();
    assert(generateHTML() === '', 'очікували порожній рядок, отримали: ' + generateHTML());
  });

  /* ─── Текстовий блок: рендер + екранування ───── */
  test('Текстовий блок рендериться з правильним тегом і текстом', () => {
    clearCanvas();
    const rw = addRow('1');
    const col = rw.querySelector('.col');
    const block = addBlockSilently('text', col);
    addTemplateTextLine(block, '.tl-list', 'Привіт, світ', { tag: 'h3' });
    const html = generateHTML();
    assertIncludes(html, '<h3', 'очікували тег h3 у виводі');
    assertIncludes(html, 'Привіт, світ', 'очікували текст рядка у виводі');
  });

  test('Текстовий блок екранує спецсимволи (XSS regression)', () => {
    clearCanvas();
    const rw = addRow('1');
    const col = rw.querySelector('.col');
    const block = addBlockSilently('text', col);
    addTemplateTextLine(block, '.tl-list', '<scr' + 'ipt>alert(1)</scr' + 'ipt>"quoted"');
    const html = generateHTML();
    assertNotIncludes(html, '<scr' + 'ipt>alert(1)</scr' + 'ipt>', 'сирий script-тег не має потрапляти у вивід як є');
    assertIncludes(html, '&lt;script&gt;', 'очікували екранований тег');
  });

  /* ─── Фон рядка: bgColor escaping (regression на знайдений XSS) ── */
  test('bgColor рядка екранується в атрибуті style (не можна вирватись лапками)', () => {
    clearCanvas();
    const rw = addRow('1');
    rw.dataset.bgColor = 'red" onmouseover="alert(1)';
    rw.dataset.bgMode = 'css';
    const html = generateHTML();
    assertNotIncludes(html, 'onmouseover="alert(1)"', 'bgColor не повинен ламати style-атрибут');
    assertIncludes(html, '&quot;', 'очікували, що лапки в bgColor екрановано');
  });

  test('buildRowSettingsHTML() екранує bgColor/bgImage у value=""', () => {
    clearCanvas();
    const rw = addRow('1');
    rw.dataset.bgColor = '"><img src=x onerror=alert(1)>';
    const panelHtml = buildRowSettingsHTML(rw);
    assertNotIncludes(panelHtml, '"><img src=x onerror=alert(1)>', 'значення поля не має вириватись із value=""');
  });

  /* ─── swimage crossfade-стек: style мерджиться, а не дублюється ── */
  test('renderSwimageStack() мерджить style (margin-block:0 + transition-duration), без двох style=""', () => {
    clearCanvas();
    const rw = addRow('1');
    const col = rw.querySelector('.col');
    const a = addBlockSilently('swimage', col);
    setField(a, '.img-url', 'https://example.com/a.jpg');
    setField(a, '.sw-id', 'img-a');
    const b = addBlockSilently('swimage', col);
    setField(b, '.img-url', 'https://example.com/b.jpg');
    setField(b, '.sw-id', 'img-b');
    const html = generateHTML();
    assertIncludes(html, 'sw-stack', 'два послідовних swimage мали згрупуватись у sw-stack');
    const imgTags = html.match(/<img\b[^>]*>/g) || [];
    assert(imgTags.length === 2, `очікували 2 <img> у стеку, знайшли ${imgTags.length}`);
    imgTags.forEach(tag => {
      const styleMatches = tag.match(/\bstyle="/g) || [];
      assert(styleMatches.length === 1, `тег має містити рівно один style="": ${tag}`);
      assertIncludes(tag, 'margin-block:0', `стек-img без margin-block:0: ${tag}`);
      assertIncludes(tag, 'transition-duration:500ms', `стек-img без transition-duration: ${tag}`);
    });
  });

  /* ─── Video MIME regression ──────────────────── */
  test('renderVideoHTML() підбирає правильний MIME для .webm', () => {
    clearCanvas();
    const rw = addRow('1');
    const col = rw.querySelector('.col');
    const block = addBlockSilently('video', col);
    setField(block, '.vid-url', 'https://example.com/clip.webm');
    const html = generateHTML();
    assertIncludes(html, 'type="video/webm"', 'очікували video/webm для .webm файлу');
    assertNotIncludes(html, 'type="video/mp4"', 'не повинно залишитись хардкоджене video/mp4');
  });

  /* ─── margin-block:0 на кожному <img> ─────────── */
  test('Кожен <img> в експорті має style з margin-block:0', () => {
    clearCanvas();
    const rw = addRow('1,1');
    const cols = rw.querySelectorAll('.col');
    const img = addBlockSilently('image', cols[0]);
    setField(img, '.img-url', 'https://example.com/a.jpg');
    const swimg = addBlockSilently('swimage', cols[1]);
    setField(swimg, '.img-url', 'https://example.com/b.jpg');
    setField(swimg, '.sw-id', 'img-x');
    const html = generateHTML();
    const imgTags = html.match(/<img\b[^>]*>/g) || [];
    assert(imgTags.length >= 2, `очікували щонайменше 2 <img>, знайшли ${imgTags.length}`);
    imgTags.forEach(tag => assert(/style="[^"]*margin-block:0/.test(tag), `<img> без margin-block:0: ${tag}`));
  });

  test('Фонове зображення рядка (overlay/natural) теж має margin-block:0', () => {
    clearCanvas();
    const rw = addRow('1');
    rw.dataset.bgImage = 'https://example.com/bg.jpg';
    rw.dataset.bgMode = 'overlay';
    let html = generateHTML();
    assertIncludes(html, 'margin-block:0', 'overlay-фон без margin-block:0');
    rw.dataset.bgMode = 'natural';
    html = generateHTML();
    assertIncludes(html, 'margin-block:0', 'natural-фон без margin-block:0');
  });

  /* ─── h3 + text-white → інлайновий color (перебиває хардкод сайту) ── */
  test('h3 з кольором text-white отримує style="color:#FFFFFF"', () => {
    clearCanvas();
    const rw = addRow('1');
    const col = rw.querySelector('.col');
    const block = addBlockSilently('text', col);
    addTemplateTextLine(block, '.tl-list', 'Білий заголовок', { tag: 'h3', colorCls: 'text-white' });
    const html = generateHTML();
    assertIncludes(html, '<h3', 'очікували тег h3');
    assertIncludes(html, 'style="color:#FFFFFF"', 'h3 з text-white мав отримати інлайновий color');
  });

  test('h3 без обраного кольору не отримує зайвого style', () => {
    clearCanvas();
    const rw = addRow('1');
    const col = rw.querySelector('.col');
    const block = addBlockSilently('text', col);
    addTemplateTextLine(block, '.tl-list', 'Звичайний заголовок', { tag: 'h3' });
    const html = generateHTML();
    assertNotIncludes(html, 'style="color:', 'без обраного кольору style="color:" не має з’являтись');
  });

  test('<p> з кольором НЕ отримує інлайновий color (лише h3 хардкодиться на сайті)', () => {
    clearCanvas();
    const rw = addRow('1');
    const col = rw.querySelector('.col');
    const block = addBlockSilently('text', col);
    addTemplateTextLine(block, '.tl-list', 'Білий параграф', { tag: 'p', colorCls: 'text-white' });
    const html = generateHTML();
    assertIncludes(html, 'text-white', 'клас кольору має бути присутній');
    assertNotIncludes(html, 'style="color:', 'для <p> інлайновий color не потрібен');
  });

  /* ─── Undo/redo базовий цикл ──────────────────── */
  test('undo() повертає canvas до попереднього стану', () => {
    clearCanvas();
    pushHistory(); // база: порожній canvas
    addRow('1');
    pushHistory();
    assert(document.querySelectorAll('#canvas .row').length === 1, 'мало бути 1 контейнер після addRow');
    undo();
    assert(document.querySelectorAll('#canvas .row').length === 0, 'undo мав прибрати доданий контейнер');
    redo();
    assert(document.querySelectorAll('#canvas .row').length === 1, 'redo мав повернути контейнер');
  });

  /* ─── Serialize / rehydrate не дублює службову розмітку ─── */
  test('serializeProject()/rehydrateCanvas() не плодить #empty-state/#add-row-zone', () => {
    clearCanvas();
    addRow('1');
    for (let i = 0; i < 3; i++) rehydrateCanvas(serializeProject());
    assert(document.querySelectorAll('#empty-state').length === 1, `очікували 1 #empty-state, отримали ${document.querySelectorAll('#empty-state').length}`);
    assert(document.querySelectorAll('#add-row-zone').length === 1, `очікували 1 #add-row-zone, отримали ${document.querySelectorAll('#add-row-zone').length}`);
    assert(document.querySelectorAll('#canvas .row').length === 1, 'кількість рядків не повинна рости від самого лише round-trip');
  });

  /* ─── Serialize / rehydrate round-trip ───────── */
  test('serializeProject() → rehydrateCanvas() зберігає вміст блоку', () => {
    clearCanvas();
    const rw = addRow('1');
    const col = rw.querySelector('.col');
    const block = addBlockSilently('text', col);
    addTemplateTextLine(block, '.tl-list', 'Round-trip перевірка');
    const snap = serializeProject();
    rehydrateCanvas(snap);
    const html = generateHTML();
    assertIncludes(html, 'Round-trip перевірка', 'текст мав пережити serialize→rehydrate');
  });

  /* ─── Шаблони секцій не кидають винятків ──────── */
  test('Усі SECTION_TEMPLATES будуються без винятків і додають рядок(и)', () => {
    SECTION_TEMPLATES.forEach(tpl => {
      clearCanvas();
      tpl.build();
      const rows = document.querySelectorAll('#canvas .row').length;
      assert(rows > 0, `шаблон "${tpl.key}" не додав жодного контейнера`);
    });
  });

  /* ─── Regression: перший рядок текстового блоку в шаблонах не порожній ── */
  test('Жоден шаблон не залишає порожній перший рядок у .tl-list', () => {
    SECTION_TEMPLATES.forEach(tpl => {
      clearCanvas();
      tpl.build();
      document.querySelectorAll('#canvas .block[data-type="text"] .tl-list').forEach(list => {
        const lines = [...list.querySelectorAll('.tl-input')];
        assert(lines.length > 0, `шаблон "${tpl.key}": текстовий блок без жодного рядка`);
        assert(lines[0].value.trim() !== '', `шаблон "${tpl.key}": перший рядок .tl-list порожній (значення: ${JSON.stringify(lines.map(l => l.value))})`);
        assert(lines.every(l => l.value.trim() !== ''), `шаблон "${tpl.key}": є порожній рядок серед ${JSON.stringify(lines.map(l => l.value))}`);
      });
    });
  });

  /* ─── Ніде в програмі немає інших тегів заголовків, крім h3 ── */
  test('Жоден шаблон не використовує h1/h2/h4-h6 — лише h3', () => {
    SECTION_TEMPLATES.forEach(tpl => {
      clearCanvas();
      tpl.build();
      const html = generateHTML();
      assert(!/<h[1246]\b/.test(html), `шаблон "${tpl.key}" згенерував заборонений тег заголовка: ${html.match(/<h[1246]\b[^>]*>/)}`);
    });
  });

  /* ─── "Зображення зліва + текст справа": DOM=текст,зображення; десктоп-порядок міняється, мобільний — ні ── */
  test('Шаблон "Зображення зліва": на мобільній текст згори, на десктопі зображення зліва (order)', () => {
    clearCanvas();
    buildImageTextRow('left');
    const cols = [...document.querySelectorAll('#canvas .col')];
    assert(cols.length === 2, `очікували 2 колонки, отримали ${cols.length}`);
    assert(cols[0].querySelector('.tl-input'), 'перша колонка в DOM (мобільна: згори) мала бути текстовою');
    assert(cols[1].querySelector('.img-url'), 'друга колонка в DOM (мобільна: знизу) мала бути зображенням');
    const html = generateHTML();
    const colDivs = html.match(/<div class="[^"]*">/g).filter(d => d.includes('flex-col'));
    assert(colDivs.length === 2, `очікували 2 div-колонки у виводі, знайшли ${colDivs.length}`);
    assertIncludes(colDivs[0], 'md:order-2', 'текстова колонка (перша в DOM) мала отримати md:order-2, щоб піти на десктопі другою');
    assertIncludes(colDivs[1], 'md:order-1', 'колонка зображення (друга в DOM) мала отримати md:order-1, щоб піти на десктопі першою (зліва)');
  });

  /* ─── Регресія: "зліва" і "справа" мали виглядати однаково В РЕДАКТОРІ,
     бо .row-cols — звичайний flex і не знає про Tailwind order-класи.
     setColOrder() тепер дублює порядок як інлайновий CSS order прямо
     на .col, щоб редактор одразу показував правильний вигляд. ────── */
  test('Шаблон "Зображення зліва": редактор (.col.style.order) теж показує зображення першим', () => {
    clearCanvas();
    buildImageTextRow('left');
    const [textCol, imgCol] = document.querySelectorAll('#canvas .col');
    assert(imgCol.style.order === '1', `.col зображення мав мати style.order = "1", отримали "${imgCol.style.order}"`);
    assert(textCol.style.order === '2', `.col тексту мав мати style.order = "2", отримали "${textCol.style.order}"`);
  });

  test('Шаблон "Зображення справа": редактор НЕ переставляє колонки (order не виставлено)', () => {
    clearCanvas();
    buildImageTextRow('right');
    const [textCol, imgCol] = document.querySelectorAll('#canvas .col');
    assert(!textCol.style.order, `.col тексту не мав мати order, отримали "${textCol.style.order}"`);
    assert(!imgCol.style.order, `.col зображення не мав мати order, отримали "${imgCol.style.order}"`);
  });

  test('Шаблон "Зображення справа": DOM-порядок вже відповідає бажаному, без order-класів', () => {
    clearCanvas();
    buildImageTextRow('right');
    const cols = [...document.querySelectorAll('#canvas .col')];
    assert(cols[0].querySelector('.tl-input'), 'перша колонка мала бути текстовою (зліва на десктопі/згори на мобільній)');
    assert(cols[1].querySelector('.img-url'), 'друга колонка мала бути зображенням (справа на десктопі/знизу на мобільній)');
    const html = generateHTML();
    assertNotIncludes(html, 'md:order-', 'для варіанту "зображення справа" order-класи не потрібні — DOM-порядок вже правильний');
  });

  test('Шаблон "Заголовок + текст + зображення": h3 → підзаголовок → текст → <img>, в одній колонці', () => {
    clearCanvas();
    const tpl = SECTION_TEMPLATES.find(t => t.key === 'title-text-image-stack');
    tpl.build();
    // Порожній .img-url нічого не рендерить (як і в будь-якому image-блоці) —
    // виставляємо URL, щоб перевірити саме порядок елементів у виводі.
    setField(document.querySelector('#canvas .block[data-type="image"]'), '.img-url', 'https://example.com/photo.jpg');
    const html = generateHTML();
    const order = [
      html.indexOf('<h3'),
      html.indexOf('Підзаголовок'),
      html.indexOf('Текст, що розкриває'),
      html.indexOf('<img'),
    ];
    assert(order.every(i => i !== -1), `очікували всі 4 елементи в виводі: ${JSON.stringify(order)}`);
    assert(order[0] < order[1] && order[1] < order[2] && order[2] < order[3], `порядок мав бути h3 → підзаголовок → текст → img, отримали позиції ${JSON.stringify(order)}`);
    assert(document.querySelectorAll('#canvas .row').length === 1, 'усе мало бути в ОДНІЙ колонці одного рядка');
  });

  /* ─── Вкладки-сторінки (pageTabs.js) ──────────── */
  test('addNewTab() додає порожню вкладку і перемикається на неї', () => {
    clearCanvas();
    const before = tabs.length;
    const prevActive = activeTabId;
    addNewTab();
    assert(tabs.length === before + 1, `очікували ${before + 1} вкладок, отримали ${tabs.length}`);
    assert(activeTabId !== prevActive, 'мали перемкнутись на нову вкладку');
    assert(document.querySelectorAll('#canvas .row').length === 0, 'нова вкладка мала бути порожньою');
  });

  test('switchToTab() зберігає вміст вихідної вкладки і відновлює цільову', () => {
    clearCanvas();
    const tabA = activeTabId;
    addRow('1');
    const blockA = addBlockSilently('text', document.querySelector('#canvas .col'));
    addTemplateTextLine(blockA, '.tl-list', 'Контент вкладки A');

    addNewTab();
    const tabB = activeTabId;
    addRow('1,1');
    assert(tabA !== tabB, 'мали отримати різні id вкладок');

    switchToTab(tabA);
    assert(activeTabId === tabA, 'мали перемкнутись назад на A');
    assertIncludes(generateHTML(), 'Контент вкладки A', 'вміст вкладки A мав зберегтись при перемиканні');

    switchToTab(tabB);
    assert(activeTabId === tabB, 'мали перемкнутись на B');
    assert(document.querySelectorAll('#canvas .row .col').length === 2, 'вкладка B мала зберегти свою розмітку (1,1 = 2 колонки)');
  });

  test('duplicateTab() створює копію з тим самим вмістом і перемикається на неї', () => {
    clearCanvas();
    const block = addBlockSilently('text', addRow('1').querySelector('.col'));
    addTemplateTextLine(block, '.tl-list', 'Контент для дублювання');
    const srcId = activeTabId;
    const before = tabs.length;

    duplicateTab(srcId);
    assert(tabs.length === before + 1, `очікували ${before + 1} вкладок, отримали ${tabs.length}`);
    assert(activeTabId !== srcId, 'duplicateTab() мав перемкнути на щойно створену копію');
    assertIncludes(generateHTML(), 'Контент для дублювання', 'копія мала успадкувати вміст оригіналу');
  });

  test('closeTab() не дає закрити останню вкладку', () => {
    while (tabs.length > 1) closeTab(tabs[tabs.length - 1].id);
    const lastId = tabs[0].id;
    closeTab(lastId);
    assert(tabs.length === 1, 'остання вкладка не мала закритись');
    assert(tabs[0].id === lastId, 'остання вкладка мала лишитись тією самою');
  });

  test('closeTab() активної вкладки перемикає на сусідню', () => {
    clearCanvas();
    const closingId = activeTabId;
    addNewTab();
    const survivorId = activeTabId;
    switchToTab(closingId);
    closeTab(closingId);
    assert(!tabs.find(t => t.id === closingId), 'закрита вкладка не мала лишитись у масиві tabs');
    assert(activeTabId === survivorId, 'мали автоматично перемкнутись на вцілілу вкладку');
  });

  test('renameTab() змінює назву вкладки', () => {
    const id = activeTabId;
    const originalPrompt = window.prompt;
    window.prompt = () => 'Нова назва';
    renameTab(id);
    window.prompt = originalPrompt;
    assert(tabs.find(t => t.id === id).title === 'Нова назва', 'назва вкладки мала змінитись на введену');
  });

  test('moveRowToTab() переносить рядок на іншу вкладку і прибирає його з поточної', () => {
    clearCanvas();
    const block = addBlockSilently('text', addRow('1').querySelector('.col'));
    addTemplateTextLine(block, '.tl-list', 'Рядок для переносу');
    const srcId = activeTabId;

    addNewTab();
    const targetId = activeTabId;
    switchToTab(srcId);
    // rehydrateCanvas() (всередині switchToTab) перестворює DOM-вузли рядків
    // наново — тому елемент .row треба брати ПІСЛЯ перемикання назад, а не
    // до (стара посилання на вузол інакше "відв'язане" від живого canvas).
    const rw = document.querySelector('#canvas .row');

    const rowsBefore = document.querySelectorAll('#canvas .row').length;
    moveRowToTab(rw, targetId);
    assert(document.querySelectorAll('#canvas .row').length === rowsBefore - 1, 'рядок мав зникнути з вихідної вкладки');
    assertNotIncludes(generateHTML(), 'Рядок для переносу', 'вміст перенесеного рядка не має лишитись у вихідній вкладці');

    switchToTab(targetId);
    assertIncludes(generateHTML(), 'Рядок для переносу', 'перенесений рядок мав з’явитись у цільовій вкладці');
  });

  test('moveRowToTab() ігнорує спробу перенести на ту саму (активну) вкладку', () => {
    clearCanvas();
    addRow('1');
    moveRowToTab(document.querySelector('#canvas .row'), activeTabId);
    assert(document.querySelectorAll('#canvas .row').length === 1, 'рядок не мав зникнути при переносі "на себе"');
  });

  /* ─── Зручніше переміщення блоків: дублювання + вгору/вниз ──── */
  test('dupBlock() дублює блок одразу після оригіналу з новим bid', () => {
    clearCanvas();
    const col = addRow('1').querySelector('.col');
    const block = addBlockSilently('text', col);
    addTemplateTextLine(block, '.tl-list', 'Оригінал');
    const bidBefore = block.dataset.bid;

    dupBlock(block);
    const blocks = [...col.querySelectorAll('.block')];
    assert(blocks.length === 2, `очікували 2 блоки в колонці, отримали ${blocks.length}`);
    assert(blocks[0] === block, 'оригінал мав лишитись першим');
    assert(blocks[1].dataset.bid !== bidBefore, 'копія мала отримати новий унікальний bid');
    const occurrences = (generateHTML().match(/Оригінал/g) || []).length;
    assert(occurrences === 2, `текст мав з’явитись двічі (оригінал + копія), знайдено ${occurrences}`);
  });

  test('moveBlock() переставляє блок вгору/вниз у межах колонки', () => {
    clearCanvas();
    const col = addRow('1').querySelector('.col');
    const b1 = addBlockSilently('text', col);
    addTemplateTextLine(b1, '.tl-list', 'Перший');
    const b2 = addBlockSilently('text', col);
    addTemplateTextLine(b2, '.tl-list', 'Другий');

    moveBlock(b2, -1);
    let blocks = [...col.querySelectorAll('.block')];
    assert(blocks[0] === b2 && blocks[1] === b1, 'moveBlock(-1) мав поставити другий блок першим');

    moveBlock(b2, 1);
    blocks = [...col.querySelectorAll('.block')];
    assert(blocks[0] === b1 && blocks[1] === b2, 'moveBlock(1) мав повернути початковий порядок');
  });

  // Прибираємо зайві вкладки, щоб звіт завершувався в чистому стані.
  while (tabs.length > 1) closeTab(tabs[tabs.length - 1].id);
  clearCanvas();

  /* ─── Рендер результатів ─────────────────────── */
  const passCount = cases.filter(c => c.pass).length;
  const summary = document.getElementById('test-summary');
  summary.textContent = `${passCount} / ${cases.length} тестів пройшло`;
  summary.className = passCount === cases.length ? 'ok' : 'fail';

  const list = document.getElementById('test-cases');
  cases.forEach(c => {
    const div = document.createElement('div');
    div.className = 't-case ' + (c.pass ? 't-pass' : 't-fail');
    div.textContent = (c.pass ? '✓ ' : '✗ ') + c.name;
    if (!c.pass && c.detail) {
      const d = document.createElement('span');
      d.className = 't-detail';
      d.textContent = c.detail;
      div.appendChild(d);
    }
    list.appendChild(div);
  });
})();
</script>
</body>
</html>
